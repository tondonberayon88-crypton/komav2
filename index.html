<!DOCTYPE html>
<html lang="en" style="color-scheme:dark" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KOMA V2 Migration Portal</title>
    
    <!-- Fonts dari DappBay -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Dots&display=swap" rel="stylesheet" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    
    <style>
        :root {
            --ui-colors-bg-1: #181A1E;
            --ui-colors-bg-2: #1E2026;
            --ui-colors-bg-3: #14151A;
            --ui-colors-text-primary: #f7f7f8;
            --ui-colors-text-secondary: #C4C5CB;
            --ui-colors-text-brand: #FFE900;
            --ui-colors-layer-3: #1E2026;
            --ui-colors-layer-4: #373943;
            --ui-colors-scene-success: #18DC7E;
            --ui-colors-scene-danger: #F8545F;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--ui-colors-bg-1);
            color: var(--ui-colors-text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            line-height: 1.5;
        }
        
        /* Header */
        header {
            width: 100%;
            height: 64px;
            background: var(--ui-colors-bg-1);
            border-bottom: 1px solid var(--ui-colors-layer-4);
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header img { height: 32px; border-radius: 50%; }
        header span { margin-left: 12px; font-weight: 700; font-size: 18px; }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Grid Layout (Mirip DappBay) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 410px;
            gap: 32px;
            width: 100%;
            margin-top: 24px;
            align-items: start;
        }
        @media (max-width: 1046px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
        }
        .hero h1 {
            font-family: "Zen Dots", sans-serif;
            font-size: 34px;
            line-height: 42px;
            letter-spacing: 1.36px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .hero h1 span { color: var(--ui-colors-text-brand); }
        .hero p {
            font-size: 16px;
            color: var(--ui-colors-text-primary);
            margin-bottom: 24px;
        }
        
        /* Gambar Banner */
        .banner-img {
            width: 100%;
            border-radius: 16px;
            object-fit: contain;
            background: var(--ui-colors-bg-2);
            padding: 60px;
            border: 1px solid var(--ui-colors-layer-4);
            aspect-ratio: 16/9;
        }

        /* Action Card */
        .action-card {
            background: var(--ui-colors-bg-2);
            border: 1px solid var(--ui-colors-bg-3);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 24px 64px 0 rgba(0,0,0,0.48);
        }
        .action-card h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--ui-colors-layer-4);
        }
        
        /* Status Box */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--ui-colors-bg-3);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .status-row .val { font-weight: 600; color: var(--ui-colors-text-secondary); }
        .status-row .val.active { color: var(--ui-colors-scene-success); }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: #f1f2f3;
            color: #14151A;
        }
        .btn-primary:hover { background: #e1e2e5; }
        
        .btn-brand {
            background: var(--ui-colors-text-brand);
            color: #14151A;
        }
        .btn-brand:hover { opacity: 0.8; }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--ui-colors-text-secondary);
            color: var(--ui-colors-text-secondary);
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Alerts */
        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-top: 16px;
            display: none;
        }
        .alert-success { background: rgba(24, 220, 126, 0.1); color: var(--ui-colors-scene-success); border: 1px solid var(--ui-colors-scene-success); }
        .alert-error { background: rgba(248, 84, 95, 0.1); color: var(--ui-colors-scene-danger); border: 1px solid var(--ui-colors-scene-danger); }

        /* Footer */
        .footer {
            margin-top: 60px;
            text-align: center;
            color: var(--ui-colors-text-secondary);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <!-- Menggunakan Logo Resmi KOMA dari DappBay -->
        <img src="https://www.logofacade.com/token_icon_request/670755d661081168c2e04412_1728533974.png" alt="KOMA Logo">
        <span>KOMA V2 Campaign</span>
    </header>

    <div class="container">
        <div class="dashboard-grid">
            
            <!-- KIRI: Konten & Gambar -->
            <div class="hero">
                <h1>KOMA V2 <span>Migration</span></h1>
                <p>Klaim token KOMA V2 (0% Tax) Anda secara gratis. Token lama Anda akan dibakar, dan token baru langsung masuk ke wallet Anda.</p>
                <!-- Menggunakan Logo Resmi KOMA dari DappBay -->
                <img src="https://www.logofacade.com/token_icon_request/670755d661081168c2e04412_1728533974.png" alt="KOMA Banner" class="banner-img">
            </div>

            <!-- KANAN: Action Card -->
            <div class="action-card">
                <h2>Claim Portal</h2>
                
                <div class="status-row">
                    <span>Network</span>
                    <span id="networkStatus" class="val">Not Connected</span>
                </div>

                <div id="walletInfo" class="status-row" style="display: none;">
                    <span>Wallet</span>
                    <span id="addressText" class="val active"></span>
                </div>

                <button id="connectBtn" class="btn btn-primary" onclick="connectWallet()">Connect Wallet</button>

                <div id="claimSection" style="display: none;">
                    <button id="claimBtn" class="btn btn-brand" onclick="claimToken()">Claim KOMA V2</button>
                    <!-- Tombol LP dinonaktifkan untuk sementara sampai pool baru dibuat -->
                    <button class="btn btn-secondary" disabled>Migrate LP (Coming Soon)</button>
                </div>

                <div id="alertBox" class="alert"></div>
            </div>

        </div>

        <div class="footer">
            Powered by KOMA Community | BNB Smart Chain
        </div>
    </div>

    <script>
        // ALAMAT BARU HASIL DEPLOY ULANG
        const MIGRATOR_ADDR = "0x89beE1ad1EF7aC5190D2beaa7890daB4d7eC6ded"; 
        const OLD_KOMA = "0xd5eaAaC47bD1993d661bc087E15dfb079a7f3C19";
        
        const MIGRATOR_ABI = ["function migrateToken(uint256 amount, bytes32[] calldata proof) external"];
        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function balanceOf(address account) view returns (uint256)"
        ];

        let provider, signer, userAddress;
        let merkleData = {}; 

        function showAlert(msg, type) {
            const el = document.getElementById("alertBox");
            el.innerText = msg;
            el.className = "alert alert-" + type;
            el.style.display = "block";
            setTimeout(() => { el.style.display = "none"; }, 8000);
        }

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x38' }], 
                    }).catch((switchError) => {
                        if (switchError.code === 4902) { showAlert("Tambahkan jaringan BSC ke wallet Anda.", "error"); }
                    });

                    document.getElementById("connectBtn").style.display = "none";
                    document.getElementById("walletInfo").style.display = "flex";
                    document.getElementById("addressText").innerText = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                    document.getElementById("networkStatus").innerText = "BSC Mainnet";
                    document.getElementById("networkStatus").className = "val active";
                    
                    document.getElementById("claimSection").style.display = "block";

                    // Load Data Merkle
                    fetch('./work/merkle_proofs.json')
                        .then(res => res.json())
                        .then(data => { merkleData = data; })
                        .catch(err => showAlert("Gagal memuat data migrasi.", "error"));

                } catch (error) {
                    showAlert("Gagal connect: " + error.message, "error");
                }
            } else {
                showAlert("Instal MetaMask atau TrustWallet terlebih dahulu!", "error");
            }
        }

        async function claimToken() {
            const data = merkleData[userAddress.toLowerCase()] || merkleData[userAddress];
            if (!data) return showAlert("Alamat Anda tidak terdaftar dalam snapshot migrasi.", "error");
            
            try {
                const amountInWei = BigInt(data.amount); 
                
                const oldKomaContract = new ethers.Contract(OLD_KOMA, ERC20_ABI, signer);
                const txApprove = await oldKomaContract.approve(MIGRATOR_ADDR, amountInWei);
                showAlert("Menunggu konfirmasi Approve...", "success");
                await txApprove.wait();

                const migratorContract = new ethers.Contract(MIGRATOR_ADDR, MIGRATOR_ABI, signer);
                const txClaim = await migratorContract.migrateToken(amountInWei, data.proof);
                showAlert("Memproses Klaim...", "success");
                await txClaim.wait();
                
                showAlert("Berhasil! KOMA V2 sudah masuk ke wallet Anda.", "success");
            } catch (e) {
                showAlert("Error: " + (e.reason || e.message), "error");
            }
        }
    </script>
</body>
</html>
